<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #111318; color: #eef0f6;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(680px, calc(100% - 32px)); padding: 40px;
      border: 1px solid #303541; border-radius: 20px;
      background: #191d25; text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { color: #aeb6c5; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 10px 16px; border-radius: 10px;
      color: #111318; background: #eef0f6; text-decoration: none;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>This website is being served from a Docker container using Nginx.</p>
    <a href="https://docs.docker.com/" target="_blank" rel="noreferrer">Learn about Docker</a>
  </main>
</body>
</html>
